<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
  <defs>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="goldShine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f0d070"/>
      <stop offset="50%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#a8882a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- SHIELD BODY -->
  <!-- Main shield fill -->
  <path d="M60,4 L108,18 L108,65 Q108,99 60,118 Q12,99 12,65 L12,18 Z"
        fill="url(#shieldFill)"/>
  <!-- Main shield border (gold) -->
  <path d="M60,4 L108,18 L108,65 Q108,99 60,118 Q12,99 12,65 L12,18 Z"
        fill="none" stroke="url(#goldShine)" stroke-width="2.5" filter="url(#glow)"/>

  <!-- INNER DECORATIVE BORDER -->
  <path d="M60,12 L100,24 L100,65 Q100,94 60,110 Q20,94 20,65 L20,24 Z"
        fill="none" stroke="#c9a84c" stroke-width="1" opacity="0.35"/>

  <!-- OPEN BOOK (main symbol) -->
  <!-- Left page -->
  <path d="M37,28 L58,23 L58,52 L37,54 Z"
        fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.85"/>
  <!-- Right page -->
  <path d="M58,23 L83,28 L83,54 L58,52 Z"
        fill="none" stroke="#c9a84c" stroke-width="1.5" opacity="0.85"/>
  <!-- Book spine center line -->
  <line x1="58" y1="23" x2="58" y2="52"
        stroke="#e8c97a" stroke-width="2" opacity="0.95"/>
  <!-- Text lines — left page -->
  <line x1="42" y1="32" x2="54" y2="30" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
  <line x1="42" y1="38" x2="54" y2="36" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
  <line x1="42" y1="44" x2="54" y2="42" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
  <!-- Text lines — right page -->
  <line x1="62" y1="30" x2="78" y2="32" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
  <line x1="62" y1="36" x2="78" y2="38" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>
  <line x1="62" y1="42" x2="78" y2="44" stroke="#c9a84c" stroke-width="1" opacity="0.55"/>

  <!-- TOP DECORATIVE DIAMOND -->
  <polygon points="60,10 64,14 60,18 56,14"
           fill="#c9a84c" opacity="0.6"/>

  <!-- UPH MONOGRAM -->
  <text x="60" y="91"
        text-anchor="middle"
        font-family="'Georgia','Times New Roman',serif"
        font-size="26" font-weight="700"
        fill="#e8c97a" letter-spacing="2">UPH</text>

  <!-- SEPARATOR LINE -->
  <line x1="30" y1="98" x2="90" y2="98"
        stroke="#c9a84c" stroke-width="1" opacity="0.5"/>

  <!-- HAÏTI LABEL -->
  <text x="60" y="110"
        text-anchor="middle"
        font-family="'Arial','Helvetica',sans-serif"
        font-size="8" font-weight="600"
        fill="#c9a84c" letter-spacing="2.5" opacity="0.8">HAITI</text>

  <!-- CORNER ACCENTS -->
  <circle cx="25" cy="18" r="1.2" fill="#c9a84c" opacity="0.4"/>
  <circle cx="95" cy="18" r="1.2" fill="#c9a84c" opacity="0.4"/>
</svg>
